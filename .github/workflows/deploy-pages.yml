name: Deploy Osan MeetUp to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2026/Summer/package-lock.json
      - name: Install
        working-directory: 2026/Summer
        run: npm ci
      - name: Build static page
        working-directory: 2026/Summer
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /OsanMeetUp/2026/Summer
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/OsanMeetUp/2026/Summer
        run: npm run build:pages
      - name: Arrange Pages paths
        run: |
          mkdir -p _site/2026/Summer
          cp -R 2026/Summer/out/. _site/2026/Summer/
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=2026/Summer/"><title>Osan MeetUp</title><a href="2026/Summer/">Osan MeetUp 2026 Summer</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
